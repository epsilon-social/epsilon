name: Build container release images
on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  check-latest-stable:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.check.outputs.is_latest_stable }}
    steps:
      # Repository needs to be cloned to list branches
      - name: Clone repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Check latest stable
        shell: bash
        id: check
        run: |
          ref="${GITHUB_REF#refs/tags/}"

          if [[ "$ref" =~ ^v([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]]; then
            current="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          else
            echo "tag $ref is not semver"
            echo "is_latest_stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git for-each-ref --format='%(refname:short)' "refs/remotes/origin/stable-*.*" \
            | sed -E 's#^origin/stable-##' \
            | sort -Vr \
            | head -n1)

          if [[ "$current" == "$latest" ]]; then
            echo "is_latest_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest_stable=false" >> "$GITHUB_OUTPUT"
          fi

  build-image:
    needs: check-latest-stable
    uses: ./.github/workflows/build-container-image.yml
    with:
      file_to_build: Dockerfile
      # ==========================================
      # EPSILON : CI
      # Push to the fork's GHCR only (GITHUB_TOKEN suffices); the
      # upstream Docker Hub/ghcr targets need secrets and permissions
      # this repository does not have.
      # ==========================================
      push_to_images: |
        ghcr.io/epsilon-social/epsilon-private
      # Do not use cache when building releases, so apt update is always ran and the release always contain the latest packages
      cache: false
      # Only tag with latest when ran against the latest stable branch
      # This needs to be updated after each minor version release
      flavor: |
        latest=${{ needs.check-latest-stable.outputs.latest }}
      # ==========================================
      # EPSILON : CI
      # Our tags (epsilon-vX.Y.Z) are not pep440 -- the pep440 types
      # would emit zero image tags and fail the push. Use the raw
      # git tag as the image tag instead.
      # ==========================================
      tags: |
        type=ref,event=tag
    secrets: inherit

  build-image-streaming:
    needs: check-latest-stable
    uses: ./.github/workflows/build-container-image.yml
    with:
      file_to_build: streaming/Dockerfile
      # ==========================================
      # EPSILON : CI
      # Same as above: fork GHCR only.
      # ==========================================
      push_to_images: |
        ghcr.io/epsilon-social/epsilon-private-streaming
      # Do not use cache when building releases, so apt update is always ran and the release always contain the latest packages
      cache: false
      # Only tag with latest when ran against the latest stable branch
      # This needs to be updated after each minor version release
      flavor: |
        latest=${{ needs.check-latest-stable.outputs.latest }}
      # ==========================================
      # EPSILON : CI
      # Our tags (epsilon-vX.Y.Z) are not pep440 -- the pep440 types
      # would emit zero image tags and fail the push. Use the raw
      # git tag as the image tag instead.
      # ==========================================
      tags: |
        type=ref,event=tag
    secrets: inherit
