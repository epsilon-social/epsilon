name: Haml Linting
on:
  # ==========================================
  # EPSILON : CI
  # Fork policy: run only on the production branch, plus manual dispatch.
  # Upstream PR / merge_group / main|stable-* triggers are intentionally
  # dropped so CI does not run on feature branches or pull requests.
  # ==========================================
  push:
    branches:
      - 'production'
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BUNDLE_ONLY: development

    steps:
      - name: Clone repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1
        with:
          bundler-cache: true

      - name: Run haml-lint
        run: |
          bin/haml-lint --reporter github
