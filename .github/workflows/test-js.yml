name: JavaScript Testing
on:
  # ==========================================
  # EPSILON : CI
  # Fork policy: run only on the production branch, plus manual dispatch.
  # Upstream PR / merge_group / main|stable-* triggers are intentionally
  # dropped so CI does not run on feature branches or pull requests.
  # ==========================================
  push:
    branches:
      - 'production'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: JavaScript testing
        run: yarn test:js
